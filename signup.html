<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cryptobs Signup</title>

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="theme-color" content="#0f1115">

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#0f1115;
  color:white;
}

/* TOP NAV */
.navbar{
  display:flex;
  justify-content:space-around;
  flex-wrap:wrap;
  background:linear-gradient(90deg,#1b1b1b,#2c2c2c);
  padding:12px;
  position:sticky;
  top:0;
}

.navbar a{
  text-decoration:none;
  color:white;
  background:#333;
  padding:10px 14px;
  border-radius:10px;
  font-size:14px;
}

/* FORM BOX */
.container{
  max-width:420px;
  margin:30px auto;
  background:#1c1f26;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.5);
}

/* INPUTS */
input{
  width:100%;
  padding:12px;
  margin-top:8px;
  margin-bottom:15px;
  border-radius:10px;
  border:none;
  outline:none;
  font-size:16px;
  box-sizing:border-box;
}

/* RADIO GROUP */
.radio-group{
  display:flex;
  justify-content:space-between;
  margin:10px 0 20px 0;
}

/* BUTTONS */
button, input[type=submit], input[type=reset]{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

input[type=submit]{
  background:#00c896;
  color:black;
  margin-bottom:10px;
}

input[type=reset]{
  background:#444;
  color:white;
}

h2{
  text-align:center;
  margin-bottom:15px;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="paste.html">Signal</a>
  <a href="ballance.html">Balance</a>
  <a href="deposit.html">Deposit</a>
</div>

<!-- FORM -->
<div class="container">

<h2>Signup</h2>

<p style="text-align:center; opacity:0.8;">
Create your account to start using Cryptobs
</p>

<form action="https://formspree.io/f/maqpqwwd" method="post">

<label>Name</label>
<input type="text" name="name" placeholder="Your name" required>

<label>Email</label>
<input type="email" name="email" placeholder="your@email.com" required>

<label>ID / Passport</label>
<input type="text" name="IDNumber" placeholder="ID or Passport" required>

<label>Gender</label>
<div class="radio-group">
  <label><input type="radio" name="Gender" value="Male" required> Male</label>
  <label><input type="radio" name="Gender" value="Female" required> Female</label>
</div>

<label>Password</label>
<input type="text" name="SecretCode" placeholder="Create password" required>

<input type="submit" value="Create Account">
<input type="reset" value="Reset">

</form>

</div>

</body>
</html>
