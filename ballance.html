<style>
body{

.navbar{

    top:0;
    z-index:1000;
}

.navbar a{
    text-decoration:none;

    background:#333;

    border-radius:10px;
    font-size:14px;
    transition:0.3s;

.navbar a:active{
    transform:scale(0.95);

.card{
    margin:20px;
    background:#1c1f26;
    padding:20px;
    border-radius:12px;

.card h2{
    text-align:center;
    margin-top:0;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:6px;
}

input[type="text"]{

    padding:12px;
    border:none;
    border-radius:8px;

    display:flex;

</head>

            name="amount"
            id="amount"

            Your Password
        </label>

        <input
            type="text"
            name="accountId"
            id="accountId"
            placeholder="Your Password"
            required>

            <input type="reset" value="Reset">
            <input type="submit" value="Submit">
        </div>

    </form>

</div>
