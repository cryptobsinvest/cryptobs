<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cryptobs</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="theme-color" content="#0f1115">

<!-- Prevent cache issues -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#0f1115;
  color:white;
}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:space-around;
  align-items:center;
  flex-wrap:wrap;
  background:linear-gradient(90deg,#1b1b1b,#2c2c2c);
  padding:12px;
  position:sticky;
  top:0;
  z-index:1000;
}

.navbar a{
  text-decoration:none;
  color:white;
  background:#333;
  padding:10px 14px;
  border-radius:10px;
  font-size:14px;
  transition:0.3s;
}

.navbar a:active{
  transform:scale(0.95);
}

/* CHART */
#tradingview_chart{
  width:100%;
  height:420px;
  border-radius:12px;
  overflow:hidden;
  margin-top:10px;
}

/* RULES BOX */
.rules{
  margin:15px;
  background:#1c1f26;
  padding:15px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.4);
}

/* INSTALL BUTTON */
#installBtn{
  position:fixed;
  left:10px;
  right:10px;
  bottom:20px;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#00c896;
  color:black;
  font-size:16px;
  font-weight:bold;
  display:none;
  z-index:9999;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="navbar">
  <a href="signup.html">Signup</a>
  <a href="ballance.html">Balance</a>
  <a href="paste.html">Signal</a>
  <a href="deposit.html">Deposit</a>
</div>

<!-- TRADINGVIEW CHART -->
<div id="tradingview_chart"></div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({
  "container_id": "tradingview_chart",
  "symbol": "XAUUSD",
  "interval": "1",
  "theme": "dark",
  "style": "1",
  "locale": "en",
  "autosize": true
});
</script>

<!-- RULES -->
<div class="rules">
  <h3>Rules and Guides</h3>
  <ol>
    <li>Every day you will get 1 signal. Paste it within 1 minute to get profit.</li>
    <li>Withdraw commission is 20%</li>
    <li>Do not share your password or secret code.</li>
  </ol>
</div>

<!-- INSTALL BUTTON -->
<button id="installBtn">Install App</button>

<script>
let deferredPrompt = null;
const installBtn = document.getElementById("installBtn");

const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

const isStandalone =
  window.matchMedia("(display-mode: standalone)").matches ||
  window.navigator.standalone === true;

// iOS install hint
if (isIOS && !isStandalone) {
  installBtn.style.display = "block";
  installBtn.textContent = "Add to Home Screen";
}

// Android install
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;

  if (!isStandalone) {
    installBtn.style.display = "block";
    installBtn.textContent = "Install Cryptobs";
  }
});

installBtn.addEventListener("click", async () => {
  if (isIOS) {
    alert(
      "To install:\n1. Tap Share\n2. Add to Home Screen"
    );
    return;
  }

  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = "none";
  }
});

window.addEventListener("appinstalled", () => {
  installBtn.style.display = "none";
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}
</script>

</body>
</html>
