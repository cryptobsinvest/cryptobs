<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cryptobs Auth</title>

<link rel="icon" href="icon-192.png">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f1115;
  color:white;
}

/* TOP MENU (your old buttons style but modern) */
.menu{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  background:linear-gradient(90deg,#1b1b1b,#2c2c2c);
  padding:12px;
  position:sticky;
  top:0;
  z-index:1000;
}

.menu a{
  text-decoration:none;
  color:white;
  background:#333;
  padding:10px 14px;
  border-radius:10px;
  font-size:14px;
}

/* CARD */
.container{
  max-width:420px;
  margin:40px auto;
  background:#1c1f26;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.5);
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:none;
  font-size:16px;
  box-sizing:border-box;
}

/* BUTTONS */
input[type=submit], button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
}

.submit{
  background:#00c896;
  color:black;
}

.reset{
  background:#444;
  color:white;
  margin-top:8px;
}

/* SWITCH */
.switch{
  text-align:center;
  margin-top:15px;
  color:#aaa;
  cursor:pointer;
}

.switch span{
  color:#00c896;
  font-weight:bold;
}

/* LOGIN HIDE */
#loginForm{
  display:none;
}

h2{
  text-align:center;
}
</style>
</head>

<body>

<!-- MENU (RESTORED OLD BUTTONS) -->
<div class="menu">
  <a href="index.html">Home</a>
  <a href="ballance.html">Balance/Withdraw</a>
  <a href="paste.html">Signal</a>
  <a href="deposit.html">Deposit</a>
</div>

<!-- MAIN BOX -->
<div class="container">

<!-- SIGN UP -->
<div id="signupForm">
  <h2>Sign Up</h2>

  <form action="https://formspree.io/f/maqpqwwd" method="post">

    <input type="text" name="name" placeholder="Name" required>

    <input type="email" name="email" placeholder="Email" required>

    <input type="text" name="IDNumber" placeholder="ID / Passport" required>

    <input type="text" name="Gender" placeholder="Gender" required>

    <input type="text" name="SecretCode" placeholder="Password" required>

    <input type="submit" class="submit" value="Create Account">
    <input type="reset" class="reset" value="Reset">

  </form>

  <div class="switch" onclick="showLogin()">
    Already have an account? <span>Sign In</span>
  </div>
</div>

<!-- LOGIN -->
<div id="loginForm">
  <h2>Sign In</h2>

  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPass" placeholder="Password">

  <button class="submit" onclick="login()">Login</button>

  <div class="switch" onclick="showSignup()">
    Don't have an account? <span>Sign Up</span>
  </div>
</div>

</div>

<script>
function showLogin(){
  document.getElementById("signupForm").style.display = "none";
  document.getElementById("loginForm").style.display = "block";
}

function showSignup(){
  document.getElementById("loginForm").style.display = "none";
  document.getElementById("signupForm").style.display = "block";
}

/* demo login */
function login(){
  let email = document.getElementById("loginEmail").value;
  let pass = document.getElementById("loginPass").value;

  let savedEmail = localStorage.getItem("email");
  let savedPass = localStorage.getItem("password");

  if(email === savedEmail && pass === savedPass){
    localStorage.setItem("loggedIn","true");
    window.location.href = "index.html";
  } else {
    alert("Invalid login");
  }
}

/* save signup (demo only) */
document.querySelector("form").addEventListener("submit", function(){
  let email = document.querySelector("input[name='email']").value;
  let pass = document.querySelector("input[name='SecretCode']").value;

  localStorage.setItem("email", email);
  localStorage.setItem("password", pass);
  localStorage.setItem("loggedIn","true");
});
</script>

</body>
</html>
