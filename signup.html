
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cryptobs Auth</title>

<link rel="icon" href="icon-192.png">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f1115;
  color:white;
}

/* MENU */
.menu{
  display:flex;
  justify-content:left;
  background:linear-gradient(90deg,#1b1b1b,#2c2c2c);
  padding:12px;
}

.menu a{
  text-decoration:none;
  color:white;
  background:#333;
  padding:10px 14px;
  border-radius:10px;
}

/* CONTAINER */
.container{
  max-width:420px;
  margin:40px auto;
  background:#1c1f26;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.5);
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:none;
  font-size:16px;
  box-sizing:border-box;
}

/* BUTTONS */
input[type=submit], button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
}

.submit{
  background:#00c896;
  color:black;
}

.reset{
  background:#444;
  color:white;
  margin-top:8px;
}

/* SWITCH */
.switch{
  text-align:center;
  margin-top:15px;
  color:#aaa;
  cursor:pointer;
}

.switch span{
  color:#00c896;
  font-weight:bold;
}

#loginBox{
  display:none;
}

h2{
  text-align:center;
}
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDFSkiBUVWpJ9e9TBE29Gavk3NDRtmkUzY",
  authDomain: "cryptobs-8e15e.firebaseapp.com",
  projectId: "cryptobs-8e15e",
  storageBucket: "cryptobs-8e15e.firebasestorage.app",
  messagingSenderId: "474911233267",
  appId: "1:474911233267:web:27f8c32c5fe2191498d386"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
</script>

</head>

<body>

<div class="menu">
  <a href="index.html">← Back</a>
</div>

<div class="container">

<!-- SIGN UP -->
<div id="signupBox">
  <h2>Sign Up</h2>

  <form id="signupForm">

    <input type="text" name="name" placeholder="Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="text" name="IDNumber" placeholder="ID / Passport" required>
    <input type="text" name="Gender" placeholder="Gender" required>
    <input type="password" name="SecretCode" placeholder="Password" required>

    <input type="submit" class="submit" value="Create Account">
    <input type="reset" class="reset">

  </form>

  <div class="switch" onclick="showLogin()">
    Already have account? <span>Sign In</span>
  </div>
</div>

<!-- LOGIN -->
<div id="loginBox">
  <h2>Sign In</h2>

  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPass" placeholder="Password">

  <button class="submit" onclick="login()">Login</button>

  <div class="switch" onclick="showSignup()">
    Don't have account? <span>Sign Up</span>
  </div>
</div>

</div>

<script>

/* SWITCH UI */
function showLogin(){
  document.getElementById("signupBox").style.display = "none";
  document.getElementById("loginBox").style.display = "block";
}

function showSignup(){
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("signupBox").style.display = "block";
}

/* SIGN UP */
document.getElementById("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.querySelector("input[name='name']").value;
  const email = document.querySelector("input[name='email']").value;
  const password = document.querySelector("input[name='SecretCode']").value;
  const idNumber = document.querySelector("input[name='IDNumber']").value;
  const gender = document.querySelector("input[name='Gender']").value;

  try {
    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
    const user = userCredential.user;

    await db.collection("users").doc(user.uid).set({
      name,
      email,
      idNumber,
      gender,
      balance: 0,
      createdAt: new Date()
    });

    alert("Account created successfully!");
    window.location.href = "index.html";

  } catch (err) {
    alert(err.message);
  }
});

/* LOGIN */
function login(){
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPass").value;

  auth.signInWithEmailAndPassword(email, password)
    .then(() => {
      alert("Login successful");
      window.location.href = "index.html";
    })
    .catch((err) => {
      alert(err.message);
    });
}
</script>

</body>
</html>
